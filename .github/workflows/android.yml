name: Android offline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'public/**', 'tests/**', 'package*.json', '*.config.*', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.1'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm run lint && npm test && npm run build && npm run android:sync
      - run: ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest
      - run: python3 tests/android-manifest.py android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
      - name: Habilitar KVM no runner
        run: sudo chmod 666 /dev/kvm
      - name: Validar leitura e persistência em modo avião
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash tests/android-offline.sh


